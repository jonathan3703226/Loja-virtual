<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Carrinho</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="container header-content">
            <h1>TechStore</h1>
            <a href="index.html" class="btn-cart">⬅ Voltar à Loja</a>
        </div>
    </header>

    <main class="container carrinho-container">
        <h2>Seu Carrinho</h2>
        <div id="carrinho-lista" class="lista-carrinho">
            <!-- JS injeta os itens do LocalStorage aqui -->
        </div>
        
        <div id="carrinho-resumo" class="resumo-box">
            <h3 class="total-texto">Total: <span id="total-valor">R$ 0,00</span></h3>
            <button class="btn-finalizar" onclick="limparCarrinho()">Finalizar Compra</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
